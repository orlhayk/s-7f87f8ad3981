const d=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"==".slice(0,(4-s.length%4)%4)),c=>c.charCodeAt(0));
(async()=>{const m=document.getElementById("m");

try{const k=await crypto.subtle.importKey("raw",d(location.hash.slice(1)),"AES-GCM",false,["decrypt"]);
const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(IV)},k,d(CT));
const content=new DOMParser().parseFromString(new TextDecoder().decode(p),"text/html");
document.title=content.title;
document.head.replaceChildren(...Array.from(content.head.childNodes));
document.body.replaceChildren(...Array.from(content.body.childNodes));
// Keep the decryption key in the fragment when navigating within the document.
document.addEventListener("click",event=>{
const link=event.target.closest?.('a[href^="#"]');
if(!link)return;
const target=document.getElementById(link.getAttribute("href").slice(1));
if(target){event.preventDefault();target.scrollIntoView({behavior:"smooth"});}
});}catch(e){m.textContent="このリンクでは開けません。"}})();
